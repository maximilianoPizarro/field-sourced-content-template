{{- $userCount := .Values.userCount | default 30 | int }}
{{- $hash := "{SHA}Y8G9w3Gr8Xk7wCpfl3mOr8KCbr4=" }}
apiVersion: v1
kind: Secret
metadata:
  name: htpasswd-workshop-users
  namespace: openshift-config
  annotations:
    argocd.argoproj.io/sync-wave: "1"
type: Opaque
stringData:
  htpasswd: |
    {{- range $i := until $userCount }}
    user{{ add1 $i }}:{{ $hash }}
    {{- end }}
    platformadmin:{{ $hash }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: oauth-patcher
  namespace: openshift-config
  annotations:
    argocd.argoproj.io/sync-wave: "1"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: oauth-patcher
  annotations:
    argocd.argoproj.io/sync-wave: "1"
rules:
- apiGroups: ["config.openshift.io"]
  resources: ["oauths"]
  verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: oauth-patcher
  annotations:
    argocd.argoproj.io/sync-wave: "1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: oauth-patcher
subjects:
- kind: ServiceAccount
  name: oauth-patcher
  namespace: openshift-config
---
apiVersion: batch/v1
kind: Job
metadata:
  name: oauth-htpasswd-setup
  namespace: openshift-config
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: oauth-patcher
      containers:
      - name: patch-oauth
        image: registry.redhat.io/openshift4/ose-cli:latest
        command:
        - /bin/bash
        - -c
        - |
          set -e

          NAMES=$(oc get oauth cluster -o jsonpath='{.spec.identityProviders[*].name}' 2>/dev/null || echo "")

          for N in $NAMES; do
            if [ "$N" = "workshop-users" ]; then
              echo "HTPasswd identity provider 'workshop-users' already configured."
              exit 0
            fi
          done

          echo "Adding HTPasswd identity provider 'workshop-users'..."

          oc get oauth cluster -o jsonpath='{.spec.identityProviders}' >/dev/null 2>&1
          if [ $? -ne 0 ] || [ -z "$(oc get oauth cluster -o jsonpath='{.spec.identityProviders}' 2>/dev/null)" ]; then
            oc patch oauth cluster --type=json -p '[
              {"op": "add", "path": "/spec/identityProviders", "value": [
                {
                  "name": "workshop-users",
                  "mappingMethod": "claim",
                  "type": "HTPasswd",
                  "htpasswd": {
                    "fileData": {
                      "name": "htpasswd-workshop-users"
                    }
                  }
                }
              ]}
            ]'
          else
            oc patch oauth cluster --type=json -p '[
              {"op": "add", "path": "/spec/identityProviders/-", "value": {
                "name": "workshop-users",
                "mappingMethod": "claim",
                "type": "HTPasswd",
                "htpasswd": {
                  "fileData": {
                    "name": "htpasswd-workshop-users"
                  }
                }
              }}
            ]'
          fi

          echo "OAuth patched. Users can log in via 'workshop-users' provider."
          echo "OAuth pods will restart automatically (~2 min)."
---
# OpenShift Group for htpasswd attendees (user1…userN). platformadmin is bound separately.
apiVersion: user.openshift.io/v1
kind: Group
metadata:
  name: workshop-attendees
  annotations:
    argocd.argoproj.io/sync-wave: "1"
users:
{{- range $i := until $userCount }}
- user{{ add1 $i }}
{{- end }}
---
# Instructor / platform engineer: full cluster scope (Operators, all lab namespaces, console plugins).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: platformadmin-cluster-admin
  annotations:
    argocd.argoproj.io/sync-wave: "1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
- apiGroup: rbac.authorization.k8s.io
  kind: User
  name: platformadmin
---
# Read-only cluster access so the OpenShift console can list Kafka, IntegrationFlow,
# NeuroFace, Industrial Edge, Lightspeed, Operators, and CRDs (not only userN-apps).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: workshop-console-viewer
  annotations:
    argocd.argoproj.io/sync-wave: "1"
rules:
- apiGroups: ["*"]
  resources: ["*"]
  verbs: ["get", "list", "watch"]
- nonResourceURLs: ["*"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: workshop-attendees-console-viewer
  annotations:
    argocd.argoproj.io/sync-wave: "1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: workshop-console-viewer
subjects:
- apiGroup: rbac.authorization.k8s.io
  kind: Group
  name: workshop-attendees
---
# Metrics in Developer/Administrator Observe (if the ClusterRole exists on the cluster).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: workshop-attendees-cluster-monitoring-view
  annotations:
    argocd.argoproj.io/sync-wave: "1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-monitoring-view
subjects:
- apiGroup: rbac.authorization.k8s.io
  kind: Group
  name: workshop-attendees
---
# Module 19: list/create/update IntegrationFlow and pause/resume in the console plugin.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: workshop-attendees-integration-edit
  namespace: openshift-integration
  annotations:
    argocd.argoproj.io/sync-wave: "1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: edit
subjects:
- apiGroup: rbac.authorization.k8s.io
  kind: Group
  name: workshop-attendees
