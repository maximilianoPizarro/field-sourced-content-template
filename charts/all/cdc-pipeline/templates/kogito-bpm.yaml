# SonataFlow workflow: invoke kafka MCP server and send report via Mailpit
apiVersion: sonataflow.org/v1alpha08
kind: SonataFlow
metadata:
  name: mcpclusterreport
  namespace: kogito-bpm
  annotations:
    sonataflow.org/description: "Calls kafka-mcp-server via MCP and emails the report through Mailpit"
    sonataflow.org/version: "1.0.0"
    argocd.argoproj.io/sync-wave: "9"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  labels:
    app: mcpclusterreport
    app.kubernetes.io/part-of: kogito-bpm
    app.openshift.io/runtime: kogito
spec:
  flow:
    start: NormalizeInput
    functions:
      - name: normalizeInput
        type: expression
        operation: |
          . + {
            namespace: (.namespace // "kafka-cdc"),
            toolName: (.toolName // "list_topics"),
            topicName: (.topicName // "bpm.onboarding.metrics"),
            recipient: (.recipient // "workshop.demo@neuralbank.io")
          }
      - name: callMcpBridge
        type: custom
        operation: "rest:post:http://mcp-invoker-bridge.kogito-bpm.svc:8090/call-tool"
      - name: sendMailpit
        type: custom
        operation: "rest:post:http://mcp-invoker-bridge.kogito-bpm.svc:8090/send-mail"
      - name: logComplete
        type: custom
        operation: sysout
    states:
      - name: NormalizeInput
        type: operation
        actions:
          - name: defaults
            functionRef:
              refName: normalizeInput
        transition: CallMcpTool

      - name: CallMcpTool
        type: operation
        actions:
          - name: invokeMcp
            functionRef:
              refName: callMcpBridge
            actionDataFilter:
              fromStateData: |
                {toolName: .toolName, toolArgs: (if .toolArgs then .toolArgs else {} end)}
              toStateData: ".mcpResult"
        transition: SendReportEmail

      - name: SendReportEmail
        type: operation
        actions:
          - name: sendMail
            functionRef:
              refName: sendMailpit
            actionDataFilter:
              fromStateData: "."
          - name: logDone
            functionRef:
              refName: logComplete
              arguments:
                message: "MCP report emailed via Mailpit"
        end: true
  podTemplate:
    container:
      env:
      - name: KOGITO_DATAINDEX_URL
        value: http://sonataflow-data-index-http.kogito-bpm.svc.cluster.local:8080
      - name: KOGITO_JOBSERVICE_URL
        value: http://sonataflow-jobs-http.kogito-bpm.svc.cluster.local:8080
      startupProbe:
        httpGet:
          path: /q/health/live
          port: 8080
          scheme: HTTP
        failureThreshold: 30
        periodSeconds: 10
        initialDelaySeconds: 5
      readinessProbe:
        httpGet:
          path: /q/health/live
          port: 8080
          scheme: HTTP
        periodSeconds: 10
        failureThreshold: 3
      livenessProbe:
        httpGet:
          path: /q/health/live
          port: 8080
          scheme: HTTP
        periodSeconds: 30
        failureThreshold: 3
---
