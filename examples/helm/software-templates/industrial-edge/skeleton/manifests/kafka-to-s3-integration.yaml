{%- if values.anomalyDetection %}
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-to-s3-routes
  namespace: ${{values.namespace}}
data:
  kafka-to-s3.camel.yaml: |
    - route:
        id: kafka-vibration-to-s3
        from:
          uri: kafka:iot-sensor-sw-vibration
          parameters:
            brokers: ${{values.uniqueName}}-cluster-kafka-bootstrap.${{values.namespace}}.svc:9092
            groupId: camel-quarkus-s3-vibr
            autoOffsetReset: latest
            valueDeserializer: org.apache.kafka.common.serialization.StringDeserializer
          steps:
            - log:
                message: "Vibration event from Kafka: ${body}"
            - convertBodyTo:
                type: java.lang.String
            - aggregate:
                aggregationStrategy: "#class:org.apache.camel.processor.aggregate.GroupedBodyAggregationStrategy"
                completionSize: 5
                correlationExpression:
                  constant:
                    expression: "true"
                steps:
                  - setHeader:
                      name: CamelAwsS3Key
                      simple: "${{values.uniqueName}}-vibration-${date:now:yyyyMMdd-HHmmss}.txt"
                  - to:
                      uri: aws2-s3://sensor-data
                      parameters:
                        accessKey: minio
                        secretKey: "RAW(minio123)"
                        region: us-east-1
                        overrideEndpoint: true
                        uriEndpointOverride: http://minio.${{values.namespace}}.svc:9000
                        forcePathStyle: true
                  - log:
                      message: "Uploaded vibration batch to S3"
    - route:
        id: kafka-temperature-to-s3
        from:
          uri: kafka:iot-sensor-sw-temperature
          parameters:
            brokers: ${{values.uniqueName}}-cluster-kafka-bootstrap.${{values.namespace}}.svc:9092
            groupId: camel-quarkus-s3-temp
            autoOffsetReset: latest
            valueDeserializer: org.apache.kafka.common.serialization.StringDeserializer
          steps:
            - log:
                message: "Temperature event from Kafka: ${body}"
            - convertBodyTo:
                type: java.lang.String
            - aggregate:
                aggregationStrategy: "#class:org.apache.camel.processor.aggregate.GroupedBodyAggregationStrategy"
                completionSize: 5
                correlationExpression:
                  constant:
                    expression: "true"
                steps:
                  - setHeader:
                      name: CamelAwsS3Key
                      simple: "${{values.uniqueName}}-temperature-${date:now:yyyyMMdd-HHmmss}.txt"
                  - to:
                      uri: aws2-s3://sensor-data
                      parameters:
                        accessKey: minio
                        secretKey: "RAW(minio123)"
                        region: us-east-1
                        overrideEndpoint: true
                        uriEndpointOverride: http://minio.${{values.namespace}}.svc:9000
                        forcePathStyle: true
                  - log:
                      message: "Uploaded temperature batch to S3"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-to-s3
  namespace: ${{values.namespace}}
  labels:
    app: kafka-to-s3
    app.openshift.io/runtime: camel
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-to-s3
  template:
    metadata:
      labels:
        app: kafka-to-s3
        app.openshift.io/runtime: camel
    spec:
      containers:
        - name: camel
          image: docker.io/apache/camel-jbang:4.21.0-21-jdk
          imagePullPolicy: IfNotPresent
          workingDir: /tmp
          command: ["camel"]
          args:
            - "run"
            - "/etc/camel/routes/kafka-to-s3.camel.yaml"
            - "--runtime=quarkus"
          env:
            - name: HOME
              value: /tmp
            - name: JBANG_DIR
              value: /tmp/.jbang
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: routes
              mountPath: /etc/camel/routes
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 36
          livenessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 20
          readinessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 10
      volumes:
        - name: routes
          configMap:
            name: kafka-to-s3-routes
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-to-s3
  namespace: ${{values.namespace}}
  labels:
    app: kafka-to-s3
spec:
  selector:
    app: kafka-to-s3
  ports:
    - name: http
      port: 8080
      targetPort: 8080
{%- else %}
# Kafka→S3 Camel Quarkus route disabled — anomaly detection not enabled
{%- endif %}
