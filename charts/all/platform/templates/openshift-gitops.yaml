apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  annotations:
    argocd.argoproj.io/sync-options: ServerSideApply=true
  name: openshift-gitops-cluster-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
- kind: ServiceAccount
  name: openshift-gitops-argocd-application-controller
  namespace: openshift-gitops
---
apiVersion: argoproj.io/v1beta1
kind: ArgoCD
metadata:
  name: openshift-gitops
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-options: ServerSideApply=true
spec:
  controller:
    resources:
      limits:
        cpu: "4"
        memory: 6Gi
      requests:
        cpu: 500m
        memory: 2Gi
    env:
      - name: ARGOCD_CONTROLLER_REPLICAS
        value: "1"
  repo:
    resources:
      limits:
        cpu: "2"
        memory: 2Gi
      requests:
        cpu: 250m
        memory: 512Mi
  server:
    resources:
      limits:
        cpu: "2"
        memory: 1Gi
      requests:
        cpu: 125m
        memory: 256Mi
  # Treat AtLatestKnown as Healthy even if a stale InstallPlanFailed/ResolutionFailed
  # condition remains (common on RHDP when GitOps CRDs already exist). Otherwise
  # clustergroup sync waves wait forever and child Applications never appear.
  extraConfig:
    resource.customizations.health.operators.coreos.com_Subscription: |
      hs = {}
      if obj.status ~= nil and obj.status.state == "AtLatestKnown" then
        hs.status = "Healthy"
        hs.message = "AtLatestKnown"
        return hs
      end
      if obj.status ~= nil and obj.status.state == "UpgradeFailed" then
        hs.status = "Degraded"
        hs.message = obj.status.state
        return hs
      end
      hs.status = "Progressing"
      hs.message = "Waiting for operator install"
      return hs
