global:
  profile: full
  localClusterDomain: ""
  hubClusterDomain: ""
  lightspeed:
    llmApiKey: "sk-no-key"
    llmEndpoint: ""
    model: "qwen25-7b-instruct"

userCount: 30
clusterDomain: ""
devspaces:
  enabled: true

# --- from developer-hub ---
# Vendored from https://gitlab.com/maximilianoPizarro/connectivity-link (developer-hub)
enabled: true
clusterDomain: ""
userCount: 30

# --- from applicationsets ---
clusterDomain: ""
userCount: 30

# --- from showroom ---
# Showroom Lab Guide Configuration
showroom:
  enabled: true
  namespace: showroom
  name: showroom
  url: ""

  # Lab guide Git repository
  content:
    repoUrl: "https://github.com/maximilianoPizarro/field-sourced-content-template.git"
    repoRef: "main"
    antoraPlaybook: "showroom/site.yml"
    image: "quay.io/rhpds/showroom-content:v1.3.1"

  # Nookbag bundle - RHDP showroom chrome (top bar, side panel, tabs)
  nookbag:
    enabled: true
    bundleUrl: "https://github.com/rhpds/nookbag/releases/download/nookbag-v0.3.2/nookbag-v0.3.2.zip"

  # Terminal configuration
  terminal:
    enabled: true
    image: "quay.io/rhpds/openshift-showroom-terminal-ocp:latest"
    resources:
      requests:
        cpu: "500m"
        memory: "512Mi"
      limits:
        cpu: "500m"
        memory: "1Gi"

# RHDP order page (AgnosticD scans for demo.redhat.com/userinfo)
userInfo:
  enabled: true
  title: "Event-Driven Architecture Workshop"
  instructions: "Open Showroom first. OpenShift / Gitea / Developer Hub: user1…userN / Welcome123!. Registration, Kafka Console, and Argo CD URLs are listed on this page."

# Injected by parent chart / Pattern extraLocalClusterDomainFields
deployer:
  domain: ""

# Used by userdata ConfigMap (CDC demo variables are auto-derived from deployer.domain)

# --- from workshop-registration ---
registration:
  enabled: true
  maxUsers: 200
  adminToken: "workshop-admin-2024"

keycloak:
  url: ""
  realm: "backstage"
  adminUser: "admin"
  adminPassword: ""

# --- from devspaces ---
# Vendored from https://gitlab.com/maximilianoPizarro/connectivity-link (devspaces)
enabled: true
clusterDomain: ""
llmApiKey: "sk-no-key"
llmEndpoint: ""
llmModel: "qwen25-7b-instruct"
