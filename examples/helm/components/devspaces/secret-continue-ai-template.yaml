# =============================================================================
# Continue AI — reference only
# =============================================================================
# GitOps now creates Secret/continue-ai-config in the DevSpaces chart
# (developer-experience group). Same coalesce as OLS: litemaas → maas →
# lightspeed. Do not apply this file by hand unless you are debugging a
# cluster that is not using the Validated Patterns install.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: continue-ai-config
  namespace: devspaces
  labels:
    controller.devfile.io/mount-to-devworkspace: "true"
    controller.devfile.io/watch-secret: "true"
  annotations:
    controller.devfile.io/mount-as: env
type: Opaque
stringData:
  CONTINUE_API_KEY: "sk-no-key"
  CONTINUE_API_BASE: "/v1"
  CONTINUE_MODEL: "qwen25-7b-instruct"
