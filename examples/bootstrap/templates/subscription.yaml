apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: patterns-operator
  namespace: {{ .Values.patternsOperator.namespace | default "openshift-operators" }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  channel: {{ .Values.patternsOperator.channel | default "fast" }}
  installPlanApproval: Automatic
  name: patterns-operator
  source: {{ .Values.patternsOperator.source | default "community-operators" }}
  sourceNamespace: {{ .Values.patternsOperator.sourceNamespace | default "openshift-marketplace" }}
