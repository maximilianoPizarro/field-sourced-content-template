---
# =============================================================================
# Field Content Workload - Variable Defaults
# =============================================================================
# This role creates an Argo CD Application pointing at the bootstrap Helm
# chart. That chart installs the Validated Patterns Operator and a Pattern CR.
# The operator then deploys clustergroup against the repo root
# (values-global.yaml + values-hub.yaml) using the existing openshift-gitops
# instance. Do not point this role at examples/helm (legacy App-of-Apps).
#
# Automatically injected Helm values:
#   deployer.domain  - Cluster ingress domain (e.g., apps.cluster.example.com)
#   deployer.apiUrl  - Cluster API URL
#   gitops.repoUrl   - Same URL as ocp4_workload_field_content_gitops_repo_url
#   gitops.revision  - Same as ocp4_workload_field_content_gitops_repo_revision
# =============================================================================

# -----------------------------------------------------------------------------
# Required: Developer's GitOps repository URL
# -----------------------------------------------------------------------------
ocp4_workload_field_content_gitops_repo_url: ""

# -----------------------------------------------------------------------------
# Optional: Git revision and path
# -----------------------------------------------------------------------------
# Git branch, tag, or commit to deploy
ocp4_workload_field_content_gitops_repo_revision: main

# Path within the repository — Validated Patterns bootstrap (operator + Pattern CR)
ocp4_workload_field_content_gitops_repo_path: examples/bootstrap

# -----------------------------------------------------------------------------
# Optional: ArgoCD configuration
# -----------------------------------------------------------------------------
# Namespace where the ArgoCD Application will be created
ocp4_workload_field_content_namespace: openshift-gitops

# Additional Helm values merged with auto-injected deployer + gitops values
# Example (lite profile):
#   ocp4_workload_field_content_helm_values:
#     pattern:
#       extraValueFiles:
#         - /values-lite.yaml
ocp4_workload_field_content_helm_values: {}

# -----------------------------------------------------------------------------
# Deployment behavior
# -----------------------------------------------------------------------------
# This role uses a "fire and forget" approach:
#   - Creates the ArgoCD Application
#   - Verifies it was accepted by the cluster (~1 min max)
#   - Does NOT wait for sync or health status
#
# Developers are responsible for monitoring their deployment in ArgoCD/OpenShift.
