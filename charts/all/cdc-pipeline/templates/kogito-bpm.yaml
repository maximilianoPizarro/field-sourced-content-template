apiVersion: sonataflow.org/v1alpha08
kind: SonataFlowPlatform
metadata:
  name: sonataflow-platform
  namespace: kogito-bpm
  annotations:
    argocd.argoproj.io/sync-wave: "8"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  build:
    config:
      strategyOptions:
        KanikoBuildCacheEnabled: "true"
  devMode:
    baseImage: registry.redhat.io/openshift-serverless-1/logic-swf-devmode-rhel8:1.36
  services:
    dataIndex:
      enabled: true
      podTemplate:
        container:
          resources:
            requests:
              cpu: 100m
              memory: 1536Mi
            limits:
              cpu: 500m
              memory: 2Gi
          env:
          - name: QUARKUS_HTTP_CORS
            value: "true"
          - name: QUARKUS_HTTP_CORS_ORIGINS
            value: "/.*/"
          - name: QUARKUS_HTTP_CORS_METHODS
            value: "GET,POST,OPTIONS"
          - name: QUARKUS_HTTP_CORS_HEADERS
            value: "content-type,Accept,Authorization"
          - name: QUARKUS_HTTP_CORS_EXPOSED_HEADERS
            value: "Content-Type"
          - name: QUARKUS_OIDC_ENABLED
            value: "false"
          - name: QUARKUS_OIDC_TENANT_ENABLED
            value: "false"
          - name: QUARKUS_HTTP_HTTP2
            value: "false"
          startupProbe:
            httpGet:
              path: /q/health/ready
              port: 8080
              scheme: HTTP
            failureThreshold: 60
            periodSeconds: 5
            initialDelaySeconds: 10
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: 8080
              scheme: HTTP
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: 8080
              scheme: HTTP
            periodSeconds: 30
            failureThreshold: 3
            initialDelaySeconds: 120
    jobService:
      enabled: true
---
# Lightweight HTTP bridge: SonataFlow REST cannot drive MCP session handshake (initialize + tools/call)
apiVersion: v1
kind: ConfigMap
metadata:
  name: mcp-invoker-bridge
  namespace: kogito-bpm
  annotations:
    argocd.argoproj.io/sync-wave: "8"
  labels:
    app: mcp-invoker-bridge
data:
  server.py: |
    import json
    import http.client
    import os
    from http.server import BaseHTTPRequestHandler, HTTPServer

    MCP_HOST = os.environ.get("MCP_HOST", "kafka-mcp-server.kafka-cdc.svc.cluster.local")
    MCP_PORT = int(os.environ.get("MCP_PORT", "8080"))
    MAILPIT_HOST = os.environ.get("MAILPIT_HOST", "n8n-mailpit.openshift-lightspeed.svc")
    MAILPIT_PORT = int(os.environ.get("MAILPIT_PORT", "8025"))
    LISTEN_PORT = int(os.environ.get("LISTEN_PORT", "8090"))

    def unwrap(payload):
        if not isinstance(payload, dict):
            return {}
        merged = dict(payload)
        for key in ("body", "workflowdata"):
            inner = payload.get(key)
            if isinstance(inner, dict):
                merged.update(inner)
        return merged

    def mcp_request(body, session_id=None):
        conn = http.client.HTTPConnection(MCP_HOST, MCP_PORT, timeout=60)
        headers = {
            "Content-Type": "application/json",
            "Accept": "application/json, text/event-stream",
        }
        if session_id:
            headers["Mcp-Session-Id"] = session_id
        conn.request("POST", "/mcp", json.dumps(body), headers)
        resp = conn.getresponse()
        raw = resp.read().decode("utf-8", errors="replace")
        resp_headers = {k.lower(): v for k, v in resp.getheaders()}
        data = raw
        for line in raw.split("\n"):
            if line.startswith("data: "):
                data = line[6:]
                break
        conn.close()
        return resp.status, resp_headers, data

    def call_mcp_tool(tool_name, tool_args):
        _, headers, _ = mcp_request({
            "jsonrpc": "2.0",
            "id": 1,
            "method": "initialize",
            "params": {
                "protocolVersion": "2024-11-05",
                "capabilities": {},
                "clientInfo": {"name": "mcp-invoker-bridge", "version": "1.0"},
            },
        })
        sid = headers.get("mcp-session-id")
        if not sid:
            raise RuntimeError("MCP initialize missing Mcp-Session-Id header")
        mcp_request({"jsonrpc": "2.0", "method": "notifications/initialized"}, sid)
        _, _, body = mcp_request({
            "jsonrpc": "2.0",
            "id": 3,
            "method": "tools/call",
            "params": {"name": tool_name, "arguments": tool_args},
        }, sid)
        parsed = json.loads(body or "{}")
        if parsed.get("error"):
            raise RuntimeError(json.dumps(parsed["error"]))
        content = parsed.get("result", {}).get("content", [])
        if content and isinstance(content[0], dict):
            return content[0].get("text", json.dumps(parsed.get("result")))
        return json.dumps(parsed.get("result", {}))

    def send_mailpit(recipient, subject, text):
        mail = {
            "From": {"Name": "SonataFlow MCP", "Email": "sonataflow-mcp@neuralbank.io"},
            "To": [{"Name": "Workshop", "Email": recipient}],
            "Subject": subject,
            "Text": text,
        }
        conn = http.client.HTTPConnection(MAILPIT_HOST, MAILPIT_PORT, timeout=15)
        conn.request("POST", "/api/v1/send", json.dumps(mail), {"Content-Type": "application/json"})
        resp = conn.getresponse()
        raw = resp.read().decode("utf-8", errors="replace")
        conn.close()
        if resp.status >= 400:
            raise RuntimeError(f"Mailpit HTTP {resp.status}: {raw}")
        return raw

    class Handler(BaseHTTPRequestHandler):
        def log_message(self, fmt, *args):
            return

        def do_GET(self):
            if self.path in ("/health", "/q/health"):
                self.send_response(200)
                self.end_headers()
                self.wfile.write(b"ok")
            else:
                self.send_response(404)
                self.end_headers()

        def do_POST(self):
            length = int(self.headers.get("Content-Length", 0))
            payload = json.loads(self.rfile.read(length) or b"{}")
            data = unwrap(payload)
            try:
                if self.path == "/call-tool":
                    tool_name = data.get("toolName", "list_topics")
                    tool_args = data.get("toolArgs") or {}
                    result = call_mcp_tool(tool_name, tool_args)
                    body = json.dumps({"result": result}).encode()
                    self.send_response(200)
                elif self.path == "/send-mail":
                    recipient = (
                        data.get("recipient")
                        or (data.get("mail", {}).get("To") or [{}])[0].get("Email")
                        or "workshop.demo@neuralbank.io"
                    )
                    namespace = data.get("namespace", "kafka-cdc")
                    tool_name = data.get("toolName", "list_topics")
                    mcp = data.get("mcpResult") or {}
                    subject = (
                        data.get("subject")
                        or data.get("mail", {}).get("Subject")
                        or f"[SonataFlow] MCP cluster report | {namespace}"
                    )
                    text = (
                        data.get("text")
                        or data.get("mail", {}).get("Text")
                        or f"MCP kafka-mcp-server | tool={tool_name} | ns={namespace}\n\n{mcp.get('result', mcp.get('error', mcp))}"
                    )
                    result = send_mailpit(recipient, subject, text)
                    body = json.dumps({"mailpit": result}).encode()
                    self.send_response(200)
                else:
                    self.send_response(404)
                    self.end_headers()
                    return
                self.send_header("Content-Type", "application/json")
                self.send_header("Content-Length", str(len(body)))
                self.end_headers()
                self.wfile.write(body)
            except Exception as exc:
                body = json.dumps({"error": str(exc)}).encode()
                self.send_response(500)
                self.send_header("Content-Type", "application/json")
                self.end_headers()
                self.wfile.write(body)

    if __name__ == "__main__":
        HTTPServer(("0.0.0.0", LISTEN_PORT), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-invoker-bridge
  namespace: kogito-bpm
  annotations:
    argocd.argoproj.io/sync-wave: "8"
  labels:
    app: mcp-invoker-bridge
    app.kubernetes.io/part-of: kogito-bpm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-invoker-bridge
  template:
    metadata:
      labels:
        app: mcp-invoker-bridge
    spec:
      containers:
      - name: bridge
        image: docker.io/library/python:3.12-alpine
        command: ["python", "/app/server.py"]
        ports:
        - containerPort: 8090
          name: http
        env:
        - name: MCP_HOST
          value: kafka-mcp-server.kafka-cdc.svc.cluster.local
        - name: MCP_PORT
          value: "8080"
        - name: LISTEN_PORT
          value: "8090"
        volumeMounts:
        - name: script
          mountPath: /app
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        readinessProbe:
          httpGet:
            path: /health
            port: 8090
          initialDelaySeconds: 3
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8090
          initialDelaySeconds: 5
          periodSeconds: 30
      volumes:
      - name: script
        configMap:
          name: mcp-invoker-bridge
          defaultMode: 0755
---
