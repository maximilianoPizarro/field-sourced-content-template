clusterDomain: ""

global:
  # Empty = cluster default StorageClass (RHDP / gp3 / thin).
  storageClass: ""

ppe:
  enabled: true
  yolo:
    image: "quay.io/maximilianopizarro/neuroface-ppe-serving:v1.5.1"
    modelName: "yolov8n"
    modelUrl: "https://github.com/ultralytics/assets/releases/download/v8.3.0/yolov8n.pt"
    modelPath: "/mnt/models/best.pt"
    replicas: 1
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: "2"
        memory: 4Gi
    # Service port stays 8000 (NeuroFace backend NEUROFACE_PPE_ENDPOINT).
    # The prebuilt image listens on 8080.
    port: 8000
    containerPort: 8080
  kafka:
    topic: "cv.ppe.detections"
    dlqTopic: "dlq.ppe-errors"
    partitions: 3
    replicas: 3
    retentionMs: "604800000"

workbench:
  seedNotebooks: true
  notebooksRepoUrl: "https://raw.githubusercontent.com/maximilianoPizarro/field-sourced-content-template/main/examples/helm/components/neuroface-cv/notebooks"
